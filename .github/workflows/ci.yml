name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Los tests nunca llaman a OpenF1 de verdad (respx + caché temporal),
      # así que el CI no depende de internet ni del límite de peticiones.
      - name: Run tests
        run: uv run pytest --cov

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  deploy:
    needs: [tests, lint]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ~/f1-mcp && git pull --ff-only && docker compose up -d --build --remove-orphans && docker image prune -f"

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            curl -fsS https://217-154-7-81.sslip.io/health && exit 0
            sleep 5
          done
          echo "Server did not become healthy" && exit 1
