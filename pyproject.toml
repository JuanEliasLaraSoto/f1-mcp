[project]
name = "f1-mcp"
version = "0.1.0"
description = "MCP server for Formula 1 race analysis on OpenF1 data, with RAG over the FIA Sporting Regulations"
readme = "README.md"
authors = [
    { name = "Juan Lara", email = "juanelara03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
f1-mcp = "f1_mcp:main"
f1-mcp-build-index = "f1_mcp.regulations:build_main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: basic errors · I: import order · UP: modern syntax · B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads worse when split mid-sentence
"src/f1_mcp/mcp/prompts.py" = ["E501"]
# Test data (lists of dicts) reads better on one line
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[tool.coverage.run]
source = ["src/f1_mcp"]
# main() only starts the server: tested by hand, not in the test suite
omit = ["src/f1_mcp/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
